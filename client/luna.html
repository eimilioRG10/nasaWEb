<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>La Luna · Rastros de la humanidad</title>
  <!-- Página de la LUNA: los objetos que se quedaron ahí.
       Usa: imagenes/luna.jpeg, js/datos.js y js/comun.js (todo dentro de client). -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Comic+Neue:wght@700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/historias.css">
  <style>
    :root {
      --azul: #7CC4FF;          /* bordes y brillos */
      --azul-suave: rgba(124, 196, 255, .35);
      --vidrio: rgba(12, 20, 40, .62);
      --texto: #F4F7FF;
      --texto-suave: #C9D4EA;
      --verde: #5EE2A0;
      --amarillo: #FFD166;
      --gris: #9AA6BD;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; color: var(--texto);
      font-family: 'Segoe UI', Arial, sans-serif;
      background: #070B18;
      overflow-x: hidden;
    }
    h1, h2, h3, p { margin: 0; }
    :focus-visible { outline: 3px solid var(--amarillo); outline-offset: 4px; }

    /* ---------- Escena: cielo + superficie de la Luna ---------- */
    .escena {
      position: relative; min-height: 100vh; overflow: hidden;
      display: flex; flex-direction: column;
      background:
        linear-gradient(to bottom, #070B18 0%, rgba(7,11,24,.85) 22%, rgba(7,11,24,.15) 55%, rgba(7,11,24,.35) 100%),
        url("imagenes/luna.jpeg") center bottom / cover no-repeat,
        #1B2235;
    }
    /* Estrellas que parpadean */
    .estrellas { position: absolute; inset: 0; pointer-events: none; }
    .estrellas span {
      position: absolute; width: 3px; height: 3px; border-radius: 50%; background: #FFFFFF;
      animation: parpadeo 3s ease-in-out infinite;
    }
    @keyframes parpadeo { 50% { opacity: .2; } }
    .constelacion { position: absolute; top: 90px; right: 4%; width: 380px; max-width: 45%; opacity: .8; pointer-events: none; }
    .tierra-lejos {
      position: absolute; top: 40px; left: 54%; width: 74px; height: 74px; border-radius: 50%;
      background: radial-gradient(circle at 35% 35%, #7CC77A 0 22%, transparent 23%), radial-gradient(circle at 62% 66%, #7CC77A 0 16%, transparent 17%), #3D8BEB;
      box-shadow: 0 0 30px rgba(61,139,235,.6); opacity: .9;
    }
    .tierra-lejos::after { content: "Tierra"; position: absolute; top: 84px; left: 50%; transform: translateX(-50%); font-size: 13px; color: var(--texto-suave); letter-spacing: 2px; text-transform: uppercase; }

    /* ---------- Encabezado ---------- */
    .encabezado {
      position: relative; z-index: 2; width: 100%; max-width: 1200px; margin: 0 auto;
      padding: 26px 24px 0; display: flex; justify-content: space-between; align-items: flex-start; gap: 16px; flex-wrap: wrap;
    }
    .titulo .etiqueta { display: inline-block; font-size: 13px; letter-spacing: 3px; color: var(--azul); border: 1px solid var(--azul-suave); padding: 6px 12px; border-radius: 999px; margin-bottom: 12px; }
    .titulo h1 { font-size: clamp(40px, 6vw, 72px); font-weight: 800; letter-spacing: 1px; text-shadow: 0 4px 24px rgba(0,0,0,.6); }
    .titulo p { font-size: 20px; color: var(--texto-suave); margin-top: 8px; max-width: 560px; }

    /* Botón de borde (como "EXPLORAR DESTINO →") */
    .boton-borde {
      display: inline-flex; align-items: center; gap: 10px;
      min-height: 52px; padding: 0 22px;
      border: 1.5px solid var(--azul); border-radius: 10px;
      background: rgba(12, 20, 40, .45); color: var(--texto);
      font: 600 16px 'Segoe UI', Arial, sans-serif; letter-spacing: 1.5px; text-transform: uppercase;
      text-decoration: none; cursor: pointer;
      backdrop-filter: blur(6px);
      transition: background .2s, box-shadow .2s, transform .2s;
    }
    .boton-borde:hover { background: rgba(124,196,255,.18); box-shadow: 0 0 22px var(--azul-suave); transform: translateY(-2px); }
    .boton-borde svg { width: 22px; height: 22px; }

    /* Pista */
    .pista {
      position: relative; z-index: 2; width: 100%; max-width: 1200px; margin: 18px auto 0; padding: 0 24px;
      display: flex; align-items: center; gap: 12px; color: var(--texto-suave); font-size: 18px;
    }
    .pista .punto { width: 14px; height: 14px; border-radius: 50%; background: var(--amarillo); box-shadow: 0 0 0 0 rgba(255,209,102,.7); animation: pulso 1.8s infinite; }
    .contador { margin-left: auto; border: 1px solid var(--azul-suave); padding: 6px 14px; border-radius: 999px; background: var(--vidrio); font-size: 16px; }

    /* ---------- Objetos perdidos (los robots en la superficie) ---------- */
    /* Zona propia para los objetos, siempre DEBAJO del texto */
    .superficie { position: relative; z-index: 3; flex: 1; min-height: 480px; margin-top: 10px; }
    .objeto {
      position: absolute; transform: translate(-50%, -50%);
      width: 92px; height: 92px; border-radius: 50%;
      border: 3px solid var(--azul); background: rgba(232, 241, 255, .92);
      color: var(--texto);
      display: flex; align-items: center; justify-content: center;
      cursor: pointer; padding: 12px;
      transition: transform .25s cubic-bezier(.3,1.6,.5,1), box-shadow .25s;
      animation: flotar 4s ease-in-out infinite;
    }
    .objeto svg.robot { width: 100%; height: 100%; }
    .objeto::before { /* anillo que late */
      content: ""; position: absolute; inset: -10px; border-radius: 50%;
      border: 2px solid var(--amarillo); opacity: .8; animation: anillo 2.2s ease-out infinite;
    }
    .objeto:hover, .objeto:focus-visible { transform: translate(-50%, -50%) scale(1.15); box-shadow: 0 0 34px rgba(124,196,255,.7); }
    .objeto .nombre {
      position: absolute; top: 104px; left: 50%; transform: translateX(-50%);
      white-space: nowrap; font-size: 15px; font-weight: 600; letter-spacing: .5px;
      background: rgba(7,11,24,.8); border: 1px solid var(--azul-suave); padding: 4px 12px; border-radius: 999px;
    }
    .objeto.visto { border-color: var(--verde); }
    .objeto.visto::before { border-color: var(--verde); animation: none; opacity: .5; }
    .objeto.visto .check { display: flex; }
    .check { display: none; position: absolute; top: -6px; right: -6px; width: 28px; height: 28px; border-radius: 50%; background: var(--verde); color: #0B1A12; align-items: center; justify-content: center; font-weight: 800; font-size: 16px; }
    /* La sombra en el piso */
    .objeto::after { content: ""; position: absolute; bottom: -22px; left: 50%; width: 60px; height: 10px; transform: translateX(-50%); border-radius: 50%; background: rgba(0,0,0,.45); filter: blur(3px); }

    @keyframes flotar { 50% { margin-top: -8px; } }
    @keyframes anillo { from { transform: scale(.85); opacity: .9; } to { transform: scale(1.35); opacity: 0; } }
    @keyframes pulso { 70% { box-shadow: 0 0 0 12px rgba(255,209,102,0); } 100% { box-shadow: 0 0 0 0 rgba(255,209,102,0); } }

    /* ---------- GLOBO DE CÓMIC (sale del robot) ---------- */
    .globo {
      position: absolute; z-index: 5; width: 320px; max-width: calc(100vw - 32px);
      background: #FFFDF5; color: #141A2E;
      border: 3px solid #141A2E; border-radius: 26px;
      padding: 18px 20px 16px;
      box-shadow: 6px 6px 0 #141A2E, 0 0 40px rgba(124,196,255,.35);
      font-family: 'Comic Neue', 'Comic Sans MS', 'Segoe UI', sans-serif;
      animation: pop .35s cubic-bezier(.3,1.7,.5,1);
    }
    @keyframes pop { from { transform: scale(.5); opacity: 0; } }
    /* La colita del globo */
    .globo::after {
      content: ""; position: absolute; width: 24px; height: 24px;
      background: #FFFDF5; border: 3px solid #141A2E;
      left: var(--colita, 50%); margin-left: -12px;
    }
    .globo.arriba::after { bottom: -15px; border-top: 0; border-left: 0; transform: rotate(45deg); }
    .globo.abajo::after  { top: -15px; border-bottom: 0; border-right: 0; transform: rotate(45deg); }
    .globo .quien { font-size: 15px; font-weight: 700; letter-spacing: 1px; text-transform: uppercase; color: #3B6FD8; margin-bottom: 6px; }
    .globo .dice { font-size: 21px; line-height: 1.4; font-weight: 700; min-height: 88px; }
    .globo .dice .cursor { display: inline-block; width: 2px; height: 1em; background: #141A2E; vertical-align: -2px; animation: parpadeo 1s steps(1) infinite; }
    .globo .botones { display: flex; gap: 8px; margin-top: 12px; flex-wrap: wrap; }
    .globo button {
      font: 700 16px 'Comic Neue', 'Segoe UI', sans-serif; cursor: pointer;
      min-height: 44px; padding: 0 14px; border-radius: 14px;
      border: 2.5px solid #141A2E; background: #FFFFFF; color: #141A2E;
      box-shadow: 3px 3px 0 #141A2E; display: inline-flex; align-items: center; gap: 6px;
      transition: transform .1s;
    }
    .globo button:active { transform: translate(2px, 2px); box-shadow: 1px 1px 0 #141A2E; }
    .globo button.principal { background: #FFD166; }
    .globo button svg { width: 18px; height: 18px; }
    .globo .x { position: absolute; top: 8px; right: 8px; width: 36px; min-height: 36px; padding: 0; justify-content: center; box-shadow: none; border-width: 2px; border-radius: 50%; }

    /* ---------- MINI LIBRO (al dar "Conocer más") ---------- */
    .fondo-ventana {
      position: fixed; inset: 0; z-index: 10; display: none;
      align-items: center; justify-content: center; padding: 16px;
      background: rgba(3, 6, 15, .65); backdrop-filter: blur(3px);
    }
    .fondo-ventana.abierta { display: flex; }
    .libro {
      position: relative; width: 720px; max-width: 100%; max-height: 94vh; overflow-y: auto;
      border: 1.5px solid var(--azul); border-radius: 22px;
      background: rgba(10, 17, 35, .95); box-shadow: 0 0 60px rgba(124,196,255,.25);
      padding: 24px 28px; display: flex; flex-direction: column; gap: 18px;
      animation: aparecer .35s cubic-bezier(.3,1.4,.5,1);
    }
    @keyframes aparecer { from { opacity: 0; transform: translateY(20px) scale(.96); } }
    /* Que nada se encoja ni se encime: si no cabe, la ventana hace scroll */
    .libro > * { flex-shrink: 0; }
    .libro .cabeza { display: flex; align-items: center; gap: 16px; padding-right: 52px; }
    .libro .mini { width: 86px; height: 86px; flex-shrink: 0; border-radius: 50%; background: rgba(232,241,255,.95); border: 3px solid var(--azul); display: flex; align-items: center; justify-content: center; padding: 10px; }
    .libro .mini svg { width: 100%; height: 100%; }
    .libro h2 { font-size: 30px; font-weight: 800; line-height: 1.1; }
    .estado { display: inline-flex; align-items: center; gap: 8px; font-size: 14px; padding: 4px 12px; border-radius: 999px; border: 1px solid var(--azul-suave); margin-top: 6px; }
    .estado i { width: 11px; height: 11px; border-radius: 50%; }
    .pagina {
      min-height: 190px; display: flex; align-items: center; justify-content: center; text-align: center;
      font-size: clamp(22px, 3vw, 28px); line-height: 1.5; font-weight: 600;
      padding: 18px; border-radius: 18px; background: rgba(124,196,255,.07); border: 1px dashed var(--azul-suave);
    }
    .pagina.final { flex-direction: column; gap: 14px; font-size: 18px; font-weight: 400; text-align: left; align-items: stretch; }
    .ficha { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
    .ficha div { border: 1px solid var(--azul-suave); border-radius: 14px; padding: 12px; text-align: center; display: flex; flex-direction: column; gap: 4px; }
    .ficha small { color: var(--texto-suave); font-size: 13px; text-transform: uppercase; letter-spacing: 1px; }
    .ficha b { font-size: 17px; }
    .dato { border-left: 3px solid var(--amarillo); padding: 10px 14px; background: rgba(255,209,102,.08); border-radius: 0 10px 10px 0; font-size: 18px; }
    .dato strong { color: var(--amarillo); }
    .navegar { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
    .navegar .boton-borde { padding: 0 16px; }
    .puntos { display: flex; gap: 8px; }
    .puntos span { width: 11px; height: 11px; border-radius: 6px; background: rgba(124,196,255,.3); }
    .puntos span.activo { width: 28px; background: var(--amarillo); }
    .flecha { width: 54px; height: 54px; border-radius: 50%; border: 1.5px solid var(--azul); background: transparent; color: var(--texto); cursor: pointer; display: flex; align-items: center; justify-content: center; }
    .flecha:hover:not(:disabled) { background: rgba(124,196,255,.18); }
    .flecha:disabled { opacity: .3; cursor: default; }
    .flecha svg { width: 24px; height: 24px; }
    .cerrar { position: absolute; top: 14px; right: 14px; width: 46px; height: 46px; border-radius: 50%; border: 1.5px solid var(--azul); background: transparent; color: var(--texto); cursor: pointer; display: flex; align-items: center; justify-content: center; }
    .cerrar:hover { background: rgba(124,196,255,.18); }
    .cerrar svg { width: 20px; height: 20px; }

    @media (max-width: 760px) {
      .ficha { grid-template-columns: 1fr; }
      .libro { padding: 20px; }
      .libro h2 { font-size: 24px; }
      .libro .mini { width: 64px; height: 64px; }
      .pagina { min-height: 150px; font-size: 21px; }
      .navegar .boton-borde { order: 3; width: 100%; justify-content: center; }
      .ficha div { padding: 8px; }
      .objeto { width: 72px; height: 72px; }
      .objeto .nombre { top: 80px; font-size: 13px; white-space: normal; width: 112px; text-align: center; }
      .constelacion, .tierra-lejos { display: none; }
      .contador { margin-left: 0; }
      .pista { flex-wrap: wrap; }
    }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
  </style>
</head>
<body>
  <main class="escena" id="escena">
    <div class="estrellas" id="estrellas" aria-hidden="true"></div>
    <div class="tierra-lejos" aria-hidden="true"></div>
    <svg class="constelacion" viewBox="0 0 380 160" aria-hidden="true">
      <g stroke="rgba(255,255,255,.55)" stroke-width="1" fill="none">
        <path d="M20 120 L90 70 L150 95 L230 40 L300 60 L360 20"/>
        <path d="M150 95 L190 140"/>
      </g>
      <g fill="#FFFFFF">
        <circle cx="20" cy="120" r="2.5"/><circle cx="90" cy="70" r="3"/><circle cx="150" cy="95" r="2.5"/>
        <circle cx="230" cy="40" r="3.5"/><circle cx="300" cy="60" r="2.5"/><circle cx="360" cy="20" r="3"/><circle cx="190" cy="140" r="2.5"/>
      </g>
    </svg>
    <script src="js/mascota-nasa.js"></script>
    <header class="encabezado">
      <div class="titulo">
        <span class="etiqueta">DESTINO · LUNA</span>
        <h1>La Luna</h1>
        <p>Desde 1967 dejamos aquí herramientas, módulos y vehículos. Toca un objeto que brilla y escucha lo que te quiere contar.</p>
      </div>
      <a class="boton-borde" href="../index.html">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
        Volver
      </a>
      <a class="boton-borde" href="historias.html?destino=luna">
        Historias de misiones →
      </a>
    </header>

    <div class="pista">
      <span class="punto" aria-hidden="true"></span>
      <span>Los objetos con anillo amarillo todavía no los has explorado.</span>
      <span class="contador" id="contador" aria-live="polite">0 de 4 explorados</span>
    </div>

    <div class="superficie" id="superficie"></div>
  </main>

  <div class="fondo-ventana" id="fondo-ventana">
    <article class="libro" role="dialog" aria-modal="true" aria-labelledby="nombre-robot" id="ventana"></article>
  </div>

  <script src="js/datos.js"></script>
  <script src="js/comun.js"></script>
  <script>
    /* =========================================================
       Dónde quedó cada objeto en la imagen (en %, horizontal / vertical)
       y el nombre del lugar real en la Luna.
       Muevan los números si quieren acomodarlos sobre su fondo.
       ========================================================= */
    const SITIOS = {
      "eagle":      { x: 18, y: 30, sitio: "Mar de la Tranquilidad" },
      "falcon":     { x: 40, y: 68, sitio: "Montes Apeninos" },
      "intrepid":   { x: 62, y: 28, sitio: "Océano de las Tormentas" },
      "surveyor-3": { x: 82, y: 66, sitio: "Océano de las Tormentas" }
    };

    const objetosLuna = EXPLORADORES.filter(e => e.lugar === "luna");
    const superficie = document.getElementById("superficie");
    const fondoVentana = document.getElementById("fondo-ventana");
    const ventana = document.getElementById("ventana");
    let vistos = [];
    try {
      const guardados = JSON.parse(localStorage.getItem("luna-vistos")) || [];
      vistos = guardados.filter(id => objetosLuna.some(objeto => objeto.id === id));
    } catch (e) {}

    // Estrellitas en el cielo
    const estrellas = document.getElementById("estrellas");
    for (let i = 0; i < 70; i++) {
      const s = document.createElement("span");
      s.style.left = Math.random() * 100 + "%";
      s.style.top = Math.random() * 45 + "%";
      s.style.animationDelay = Math.random() * 3 + "s";
      s.style.transform = `scale(${0.5 + Math.random()})`;
      estrellas.appendChild(s);
    }

    // Poner cada objeto sobre la superficie
    function pintarObjetos() {
      superficie.innerHTML = objetosLuna.map((e, i) => {
        const p = SITIOS[e.id] || { x: 20 + i * 20, y: 50 };
        return `<button class="objeto ${vistos.includes(e.id) ? "visto" : ""}" style="left:${p.x}%;top:${p.y}%;animation-delay:${i * .6}s"
                  data-id="${e.id}" aria-label="${e.nombre}${vistos.includes(e.id) ? ", ya explorado" : ""}">
                  <svg class="robot" viewBox="0 0 120 100" aria-hidden="true"><use href="#dib-${e.dibujo}"/></svg>
                  <span class="check" aria-hidden="true">✓</span>
                  <span class="nombre">${e.nombre}</span>
                </button>`;
      }).join("");
      superficie.querySelectorAll(".objeto").forEach(b => b.onclick = () => abrir(b.dataset.id));
      document.getElementById("contador").textContent = `${vistos.length} de ${objetosLuna.length} explorados`;
    }

    /* =========================================================
       GLOBO DE CÓMIC: el robot "habla" letra por letra
       ========================================================= */
    let globoActual = null, escribiendo = null;
    const sinMovimiento = matchMedia("(prefers-reduced-motion: reduce)").matches;

    function cerrarGlobo() {
      clearInterval(escribiendo);
      if (globoActual) { globoActual.remove(); globoActual = null; }
      callar();
    }

    function abrir(id) {
      cerrarGlobo();
      const e = objetosLuna.find(x => x.id === id);
      const p = SITIOS[e.id] || { x: 50, y: 50 };
      const boton = superficie.querySelector(`.objeto[data-id="${id}"]`);

      // Marcar como explorado
      if (!vistos.includes(id)) {
        vistos.push(id);
        try { localStorage.setItem("luna-vistos", JSON.stringify(vistos)); } catch (err) {}
        boton.classList.add("visto");
        document.getElementById("contador").textContent = `${vistos.length} de ${objetosLuna.length} explorados`;
      }

      const globo = document.createElement("div");
      globo.className = "globo";
      globo.setAttribute("role", "dialog");
      globo.setAttribute("aria-label", `${e.nombre} te dice`);
      globo.innerHTML = `
        <button class="x" aria-label="Cerrar globo"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="3" stroke-linecap="round"/></svg></button>
        <p class="quien">${e.nombre} dice:</p>
        <p class="dice" aria-live="polite"><span class="texto"></span><span class="cursor" aria-hidden="true"></span></p>
        <div class="botones">
          <button class="principal" data-accion="mas">Conocer más →</button>
          <button data-accion="voz"><svg viewBox="0 0 24 24" aria-hidden="true"><use href="#bocina"/></svg>Escuchar</button>
        </div>`;
      superficie.appendChild(globo);
      globoActual = globo;

      // Medir el globo ya con todo el texto (luego se borra para escribirlo letra por letra)
      const frase = e.paginas[0];
      globo.querySelector(".texto").textContent = frase;

      // Colocar el globo junto al robot (arriba o abajo, sin salirse de la pantalla)
      const zona = superficie.getBoundingClientRect();
      const r = boton.getBoundingClientRect();
      const centroX = r.left + r.width / 2 - zona.left;
      const ancho = globo.offsetWidth;
      let izquierda = Math.min(Math.max(centroX - ancho / 2, 12), zona.width - ancho - 12);
      globo.style.left = izquierda + "px";
      globo.style.setProperty("--colita", Math.min(Math.max(centroX - izquierda, 30), ancho - 30) + "px");
      // Abajo del robot (dejando ver su nombre) si cabe; si no, arriba
      const alto = globo.offsetHeight;
      const espacioAbajo = zona.height - (r.bottom - zona.top) - 66;
      if (alto <= espacioAbajo) {
        globo.classList.add("abajo");
        globo.style.top = (r.bottom - zona.top + 62) + "px";
      } else {
        globo.classList.add("arriba");     // se ancla por abajo: crece hacia arriba
        globo.style.bottom = (zona.height - (r.top - zona.top) + 26) + "px";
      }

      // Escribir el texto letra por letra
      const destino = globo.querySelector(".texto");
      if (sinMovimiento) { destino.textContent = frase; }
      else {
        destino.textContent = "";
        let i = 0;
        escribiendo = setInterval(() => {
          destino.textContent = frase.slice(0, ++i);
          if (i >= frase.length) clearInterval(escribiendo);
        }, 28);
      }

      globo.querySelector(".x").onclick = cerrarGlobo;
      globo.querySelector('[data-accion="voz"]').onclick = () => hablar(frase);
      globo.querySelector('[data-accion="mas"]').onclick = () => { cerrarGlobo(); abrirLibro(e, 0); };
      globo.querySelector('[data-accion="mas"]').focus();
    }

    /* =========================================================
       MINI LIBRO: una página corta a la vez
       ========================================================= */
    function abrirLibro(e, pagina) {
      callar();
      const sitio = (SITIOS[e.id] || {}).sitio || "La Luna";
      const total = e.paginas.length + 1;          // + la página final con la ficha
      const esFinal = pagina === e.paginas.length;
      const puntos = Array.from({ length: total }, (_, i) => `<span class="${i === pagina ? "activo" : ""}"></span>`).join("");

      ventana.innerHTML = `
        <button class="cerrar" id="cerrar" aria-label="Cerrar">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/></svg>
        </button>
        <div class="cabeza">
          <div class="mini"><svg viewBox="0 0 120 100" aria-hidden="true"><use href="#dib-${e.dibujo}"/></svg></div>
          <div>
            <h2 id="nombre-robot">${e.nombre}</h2>
            <span class="estado"><i style="background:${e.estado === "funciona" ? "var(--verde)" : "var(--gris)"}"></i>${e.estadoTexto}</span>
          </div>
        </div>
        ${esFinal ? `
          <div class="pagina final">
            <div class="ficha">
              <div><small>Llegó en</small><b>${e.anio}</b></div>
              <div><small>Dónde quedó</small><b>${sitio}</b></div>
              <div><small>Hoy</small><b>${e.estadoTexto}</b></div>
            </div>
            <p class="dato"><strong>Dato real:</strong> ${e.dato}</p>
          </div>` : `
          <p class="pagina" aria-live="polite">${e.paginas[pagina]}</p>`}
        <div class="navegar">
          <button class="flecha" id="anterior" aria-label="Página anterior" ${pagina === 0 ? "disabled" : ""}>
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
          <button class="boton-borde" id="escuchar"><svg viewBox="0 0 24 24" aria-hidden="true"><use href="#bocina"/></svg>Escuchar</button>
          <div class="puntos" aria-label="Página ${pagina + 1} de ${total}">${puntos}</div>
          <button class="flecha" id="siguiente" aria-label="${esFinal ? "Siguiente objeto" : "Página siguiente"}">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5l7 7-7 7" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
        </div>`;
      fondoVentana.classList.add("abierta");

      document.getElementById("cerrar").onclick = cerrar;
      document.getElementById("anterior").onclick = () => abrirLibro(e, pagina - 1);
      document.getElementById("siguiente").onclick = () => {
        if (!esFinal) return abrirLibro(e, pagina + 1);
        cerrar();                                   // al final: pasar al siguiente objeto
        const i = objetosLuna.indexOf(e);
        abrir(objetosLuna[(i + 1) % objetosLuna.length].id);
      };
      document.getElementById("escuchar").onclick = () =>
        hablar(esFinal ? `Llegó en ${e.anio}. Quedó en ${sitio}. Hoy: ${e.estadoTexto}. Dato real: ${e.dato}` : e.paginas[pagina]);
      document.getElementById("siguiente").focus();
    }
    function cerrar() { callar(); fondoVentana.classList.remove("abierta"); }

    // Cerrar el globo al tocar fuera de él
    document.addEventListener("click", ev => {
      if (globoActual && !globoActual.contains(ev.target) && !ev.target.closest(".objeto, .fondo-ventana")) cerrarGlobo();
    });
    fondoVentana.onclick = ev => { if (ev.target === fondoVentana) cerrar(); };
    document.addEventListener("keydown", ev => { if (ev.key === "Escape") { cerrar(); cerrarGlobo(); } });

    pintarObjetos();
  </script>
</body>
</html>
